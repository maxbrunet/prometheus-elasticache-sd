version: 2
builds:
  - &build-default
    id: default
    main: .
    ldflags:
      - -X github.com/prometheus/common/version.Version={{ .Version }}
      - -X github.com/prometheus/common/version.Revision={{ .Commit }}
      - -X github.com/prometheus/common/version.Branch={{ .Branch }}
      - -X github.com/prometheus/common/version.BuildUser=GoReleaser
      - -X github.com/prometheus/common/version.BuildDate={{ .CommitDate }}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - dragonfly
      - freebsd
      - illumos
      - linux
      - netbsd
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
      - mips
      - mips64
      - mips64le
      - mipsle
      - ppc64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - '5'
      - '6'
      - '7'
    goamd64:
      - v1
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    go386:
      - sse2
    goppc64:
      - power8
    goriscv64:
      - rva22u64
    ignore:
      - goos: freebsd
        goarch: arm
        goarm: '5'
      - goos: netbsd
        goarch: arm
        goarm: '5'
    mod_timestamp: '{{ .CommitTimestamp }}'
  - <<: *build-default
    id: windows
    goos:
      - windows
    goarch:
      - '386'
      - amd64
      - arm64
archives:
  - &archive-default
    id: default
    ids:
      - default
      - windows
    name_template: '{{ .ProjectName }}-{{ .Version }}.{{ .Os }}-{{ .Arch }}{{
      if .Arm }}v{{ .Arm }}{{ end }}{{ if and .Mips (ne .Mips "hardfloat") }}-{{
      .Mips }}{{ end }}'
    builds_info:
      group: root
      owner: root
      mtime: '{{ .CommitDate }}'
    formats:
      - tar.gz
    files:
      - src: '{LICENSE,NOTICE}'
        info:
          owner: root
          group: root
          mtime: '{{ .CommitDate }}'
  - <<: *archive-default
    id: zip
    ids:
      - windows
    formats:
      - zip
checksum:
  name_template: sha256sums.txt
kos:
  - &ko-busybox
    id: busybox
    build: default
    repositories:
      - ghcr.io/maxbrunet/prometheus-elasticache-sd
    local_domain: ko.local/maxbrunet/prometheus-elasticache-sd
    bare: true
    tags:
      - '{{ .Tag }}-busybox'
      - '{{ .Tag }}'
      - v2-busybox
      - v2
      - latest
    base_image: quay.io/prometheus/busybox:latest@sha256:57ba692be36a8bb37322da87b164f7d2a655fdfec91ac85cc32cbdb3aa86d67a
    creation_time: '{{ .CommitTimestamp }}'
    ko_data_creation_time: '{{ .CommitTimestamp }}'
    labels: &labels-busybox
      org.opencontainers.image.authors: Maxime Brunet,The Prometheus Authors
      org.opencontainers.image.vendor: maxbrunet
      org.opencontainers.image.title: prometheus-elasticache-sd
      org.opencontainers.image.description: Prometheus Service Discovery for AWS ElastiCache
      org.opencontainers.image.source: https://github.com/maxbrunet/prometheus-elasticache-sd
      org.opencontainers.image.url: https://github.com/maxbrunet/prometheus-elasticache-sd
      org.opencontainers.image.documentation: https://github.com/maxbrunet/prometheus-elasticache-sd
      org.opencontainers.image.licenses: Apache License 2.0
      io.prometheus.image.variant: busybox
    user: nobody
    platforms:
      - linux/amd64
      - linux/arm/v7
      - linux/arm64
      - linux/ppc64le
      - linux/riscv64
      - linux/s390x
  - <<: *ko-busybox
    id: distroless
    tags:
      - '{{ .Tag }}-distroless'
      - v2-distroless
    base_image: gcr.io/distroless/static-debian13:nonroot@sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7
    labels:
      <<: *labels-busybox
      io.prometheus.image.variant: distroless
    # Base image sets USER to 65532 (nonroot user).
    user: null
docker_signs:
  - artifacts: manifests
    cmd: cosign
    args:
      - sign
      - --yes
      - ${artifact}
    output: true
